name: Deploy slides to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: 'Site base path, such as /repository/ or /; leave empty to use GitHub Pages metadata'
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build slides and prepare README
        env:
          PAGES_BASE: ${{ inputs.base || steps.pages.outputs.base_path || '/' }}
        run: npm run build:pages -- --base "$PAGES_BASE"

      - name: Render README with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./slides/dist
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
